<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siber Kimlik Testi | Ömer Siber</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#090514;color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;overflow-x:hidden}
.orb{position:fixed;border-radius:50%;filter:blur(90px);z-index:0;opacity:.55}
.o1{width:300px;height:300px;background:#ec4899;top:-50px;left:-50px}.o2{width:340px;height:340px;background:#8b5cf6;bottom:-60px;right:-50px}
.card{position:relative;z-index:1;max-width:440px;width:100%;background:rgba(18,12,36,.82);border:1px solid rgba(236,72,153,.45);border-radius:24px;padding:28px;backdrop-filter:blur(18px);box-shadow:0 20px 50px rgba(0,0,0,.6);text-align:center}
.tag{display:inline-block;font-size:.75rem;font-weight:800;padding:5px 12px;border-radius:99px;background:rgba(6,182,212,.18);color:#67e8f9;border:1px solid rgba(6,182,212,.4);margin-bottom:14px}
h1{font-size:1.75rem;font-weight:900;background:linear-gradient(90deg,#06b6d4,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
p{color:#cbd5e1;font-size:.92rem;line-height:1.5;margin-bottom:18px}
input{width:100%;padding:13px 16px;border-radius:12px;background:rgba(9,5,20,.8);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:.95rem;margin-bottom:14px;outline:none;text-align:center}
.opt{width:100%;padding:13px;margin-bottom:10px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);color:#fff;font-weight:600;cursor:pointer;transition:.2s;font-size:.9rem}
.opt:hover{border-color:#ec4899;background:rgba(236,72,153,.2)}
.btn{width:100%;padding:14px;border-radius:14px;border:none;background:linear-gradient(135deg,#ec4899,#8b5cf6);color:#fff;font-weight:800;font-size:1rem;cursor:pointer;margin-top:6px;text-decoration:none;display:inline-block}
.story{background:linear-gradient(160deg,#13092b,#090514);border:2px solid #06b6d4;border-radius:20px;padding:24px;margin-bottom:16px;box-shadow:0 0 30px rgba(6,182,212,.25)}
.score{font-size:3rem;font-weight:900;color:#ec4899;margin:8px 0}
.alias{font-family:monospace;font-size:1.1rem;color:#67e8f9;background:rgba(6,182,212,.15);padding:6px 14px;border-radius:8px;display:inline-block;margin-bottom:10px}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div>
<div class="card" id="app">
  <span class="tag">⚡ SİBER ANALİZ // 15 SANİYE</span>
  <h1>Siber Seviyen Kaç?</h1>
  <p>Dijital dünyada ne kadar gizlisin yoksa kolay hedef misin? Adını yaz, 3 soruda siber kimliğini öğren ve Story'de paylaş!</p>
  <input id="uname" placeholder="Adın veya @Instagram adın">
  <button class="btn" onclick="start()">Analizi Başlat &rarr;</button>
</div>
<script>
const qs=[
  {q:"1/3: Şifrelerinde doğum yılını veya adını kullanıyor musun?",a:[["Asla, karmaşık şifre kullanırım",35],["Bazen kolay olsun diye yaparım",15],["Evet, hepsi aynı şifre",0]]},
  {q:"2/3: Instagram hesabında 2 Faktörlü Doğrulama (2FA) açık mı?",a:[["Evet, uygulama ile korumalı",35],["Sadece SMS açık",20],["Hayır, açık değil",0]]},
  {q:"3/3: Tanımadığın bir DM linkine veya 'Telif İhlali' mesajına tıklar mısın?",a:[["Asla tıklamam, direkt engellerim",30],["Merak edip baktığım olur",10],["Evet, hemen tıklarım",0]]}
];
let step=0,pts=0,user="Anonim";
function start(){user=document.getElementById('uname').value.trim()||"Anonim";step=0;pts=0;render()}
function render(){
  if(step>=qs.length){showRes();return}
  const cur=qs[step];
  app.innerHTML=`<span class="tag">SORU ${step+1} / 3</span><h2 style="font-size:1.2rem;margin-bottom:16px">${cur.q}</h2>`+
    cur.a.map(x=>`<button class="opt" onclick="ans(${x[1]})">${x[0]}</button>`).join('');
}
function ans(p){pts+=p;step++;render()}
function showRes(){
  let title="DİKKAT: KOLAY HEDEF ⚠️",alias="Target_"+user.replace(/[^a-zA-Z0-9]/g,'').slice(0,8),desc="Hesapların tehlikede! Şifrelerini güçlendirip 2FA korumasını mutlaka açmalısın.";
  if(pts>=80){title="HAYALET HACKER (GHOST) 🥷",alias="Ghost_"+user.replace(/[^a-zA-Z0-9]/g,'').slice(0,8),desc="Dijital iz bırakmıyorsun! Siber farkındalığın üst düzeyde."}
  else if(pts>=45){title="SİBER SAVUNMACI 🛡️",alias="Cyber_"+user.replace(/[^a-zA-Z0-9]/g,'').slice(0,8),desc="Fena değilsin ama birkaç küçük açık seni riske atabilir."}
  app.innerHTML=`<div class="story"><span class="tag">SİBER KİMLİK KARTI</span><div style="font-weight:700;color:#cbd5e1">${user}</div><div class="score">%${pts}</div><div class="alias">${alias}</div><h2 style="font-size:1.2rem;color:#fff;margin-bottom:8px">${title}</h2><p style="font-size:.85rem;margin-bottom:10px">${desc}</p><div style="font-size:.75rem;color:#67e8f9;font-weight:700">Sen de test et 👉 omersiber.vercel.app/test</div></div><p style="font-size:.82rem;margin-bottom:10px">📸 Ekran görüntüsü alıp Instagram Hikayende paylaş!</p><a href="/" class="btn">Hesabını Güvene Al & Siteye Git</a>`;
}
</script>
</body>
</html>
