<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siber Duo Uyum Testi | Ömer Siber</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#090514;color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;overflow-x:hidden}
.orb{position:fixed;border-radius:50%;filter:blur(90px);z-index:0;opacity:.65;animation:fl 8s infinite alternate}
.o1{width:320px;height:320px;background:#ec4899;top:-60px;left:-60px}.o2{width:350px;height:350px;background:#06b6d4;bottom:-60px;right:-50px}
@keyframes fl{to{transform:translate(30px,-30px) scale(1.1)}}
.box{position:relative;z-index:1;max-width:440px;width:100%;background:rgba(18,12,36,.82);border:1px solid rgba(236,72,153,.5);border-radius:28px;padding:28px;backdrop-filter:blur(22px);box-shadow:0 25px 60px rgba(0,0,0,.75);text-align:center}
.tag{display:inline-block;font-size:.74rem;font-weight:800;letter-spacing:1px;padding:6px 14px;border-radius:99px;background:rgba(6,182,212,.18);color:#67e8f9;border:1px solid rgba(6,182,212,.4);margin-bottom:14px}
h1{font-size:1.85rem;font-weight:900;background:linear-gradient(90deg,#06b6d4,#a855f7,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
p{color:#cbd5e1;font-size:.92rem;line-height:1.5;margin-bottom:18px}
input{width:100%;padding:14px 16px;border-radius:14px;background:rgba(9,5,20,.85);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:1rem;margin-bottom:12px;outline:none;text-align:center;transition:.2s}
input:focus{border-color:#ec4899;box-shadow:0 0 15px rgba(236,72,153,.3)}
.btn{width:100%;padding:14px;border-radius:14px;border:none;background:linear-gradient(135deg,#ec4899,#8b5cf6);color:#fff;font-weight:800;font-size:1rem;cursor:pointer;margin-top:6px;text-decoration:none;display:inline-block;box-shadow:0 10px 25px rgba(236,72,153,.35);transition:.2s}
.btn:hover{transform:translateY(-2px)}
.btn2{background:linear-gradient(135deg,#06b6d4,#3b82f6);box-shadow:0 10px 25px rgba(6,182,212,.3)}
.duo-card{background:linear-gradient(160deg,#180c36,#090514);border:2px solid #06b6d4;border-radius:22px;padding:24px;margin-bottom:16px;box-shadow:0 0 35px rgba(6,182,212,.25)}
.big-pct{font-size:3.6rem;font-weight:900;background:linear-gradient(90deg,#06b6d4,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:6px 0}
.names{font-size:1.15rem;font-weight:800;color:#fff;margin-bottom:8px}
.badge-role{display:inline-block;background:rgba(236,72,153,.2);border:1px solid #ec4899;color:#f9a8d4;padding:6px 14px;border-radius:99px;font-size:.82rem;font-weight:700;margin-bottom:12px}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div>
<div class="box" id="app">
  <span class="tag">⚡ SİBER DUO // ARKADAŞ & PARTNER UYUMU</span>
  <h1>Siber Enerjiniz Kaç?</h1>
  <p>Kendi adını ve kankanın/partnerinin @kullanıcı adını yaz; yapay zeka dijital frekanslarınızı eşleştirsin, Story'de etiketle!</p>
  <input id="n1" placeholder="Senin Adın veya @Instagram">
  <input id="n2" placeholder="Arkadaşının Adı veya @Instagram">
  <button class="btn" onclick="calc()">Frekansları Eşleştir ⚡</button>
</div>
<canvas id="cv" width="1080" height="1920" style="display:none"></canvas>
<script>
let d={};
function calc(){
  const a=document.getElementById('n1').value.trim()||"@ben",b=document.getElementById('n2').value.trim()||"@kankam";
  app.innerHTML=`<span class="tag">TARANIYOR...</span><h2 style="margin:20px 0;color:#67e8f9">Dijital Frekanslar Eşleşiyor...</h2><div id="cnt" class="big-pct">%0</div>`;
  const raw=(a.toLowerCase()+b.toLowerCase()).split('').reduce((s,c)=>s+c.charCodeAt(0),0);
  const pct=64+(raw%36);
  let role="EFSANE HACKER EKİBİ 🥷",msg="Birlikte sistemleri çökertirsiniz! Dijital enerjiniz kusursuz eşleşiyor.";
  if(pct>=90){role="DURDURULAMAZ SİBER DUO 🔥",msg="Zihinleriniz aynı frekansta! Hiçbir güvenlik duvarı ikinizi durduramaz.";}
  else if(pct<78){role="KAOTİK KOD İKİLİSİ ⚡",msg="Biri ortalığı karıştırır diğeri toparlar; ama yan yana çok eğlencelisiniz!";}
  d={a,b,pct,role,msg};
  let cur=0;const iv=setInterval(()=>{cur+=4;if(cur>=pct){cur=pct;clearInterval(iv);setTimeout(show,300)}document.getElementById('cnt').textContent='%'+cur},35);
}
function show(){
  app.innerHTML=`
    <div class="duo-card">
      <span class="tag">SİBER DUO ANALİZ RAPORU</span>
      <div class="names">${d.a} &nbsp;⚡&nbsp; ${d.b}</div>
      <div class="big-pct">%${d.pct}</div>
      <div class="badge-role">${d.role}</div>
      <p style="font-size:.86rem;margin-bottom:12px">${d.msg}</p>
      <div style="font-size:.75rem;color:#67e8f9;font-weight:700">Sen de arkadaşını test et 👉 omersiber.vercel.app/test.html</div>
    </div>
    <button class="btn btn2" onclick="dl()">📥 Story Kartını İndir & Etiketle</button>
    <button class="btn" style="background:rgba(255,255,255,.08)" onclick="location.reload()">Başka Birini Test Et</button>
    <a href="/" class="btn">Ömer Siber Ana Sayfaya Git</a>`;
}
function dl(){
  const c=document.getElementById('cv'),x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,1080,1920);g.addColorStop(0,'#090514');g.addColorStop(0.5,'#1b0c3b');g.addColorStop(1,'#090514');
  x.fillStyle=g;x.fillRect(0,0,1080,1920);
  x.strokeStyle='#06b6d4';x.lineWidth=10;x.strokeRect(70,150,940,1620);
  x.fillStyle='#67e8f9';x.font='bold 40px monospace';x.textAlign='center';x.fillText('⚡ SİBER DUO UYUM RAPORU',540,280);
  x.fillStyle='#ffffff';x.font='bold 56px sans-serif';x.fillText(d.a+'  ⚡  '+d.b,540,460);
  x.fillStyle='#ec4899';x.font='900 160px sans-serif';x.fillText('%'+d.pct,540,710);
  x.fillStyle='#67e8f9';x.font='bold 48px sans-serif';x.fillText(d.role,540,840);
  x.fillStyle='#cbd5e1';x.font='36px sans-serif';x.fillText(d.msg.slice(0,45),540,960);x.fillText(d.msg.slice(45),540,1015);
  x.fillStyle='#ec4899';x.font='bold 42px sans-serif';x.fillText('ARKADAŞINI ETİKETLE & SEN DE TEST ET!',540,1500);
  x.fillStyle='#67e8f9';x.font='bold 48px monospace';x.fillText('omersiber.vercel.app/test.html',540,1585);
  const a=document.createElement('a');a.download='siber-duo-story.png';a.href=c.toDataURL('image/png');a.click();
}
</script>
</body>
</html>
