<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bana Anonim Sor | Ömer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#090514;color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;overflow-x:hidden}
.orb{position:fixed;border-radius:50%;filter:blur(90px);z-index:0;opacity:.65}
.o1{width:320px;height:320px;background:#ec4899;top:-60px;left:-60px}.o2{width:340px;height:340px;background:#8b5cf6;bottom:-60px;right:-50px}
.box{position:relative;z-index:1;max-width:440px;width:100%;background:rgba(18,12,36,.85);border:1px solid rgba(236,72,153,.5);border-radius:28px;padding:28px;backdrop-filter:blur(20px);box-shadow:0 25px 60px rgba(0,0,0,.75);text-align:center}
.head{background:linear-gradient(135deg,#ec4899,#8b5cf6);padding:20px;border-radius:20px;margin-bottom:18px;box-shadow:0 10px 25px rgba(236,72,153,.35)}
.head h1{font-size:1.35rem;font-weight:900;margin-top:4px}
textarea{width:100%;padding:16px;border-radius:16px;background:rgba(9,5,20,.85);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:1rem;outline:none;resize:none;margin-bottom:12px}
textarea:focus{border-color:#06b6d4}
.dice{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#67e8f9;padding:8px 14px;border-radius:99px;font-size:.82rem;font-weight:700;cursor:pointer;margin-bottom:14px}
.btn{width:100%;padding:15px;border-radius:16px;border:none;background:linear-gradient(135deg,#06b6d4,#3b82f6);color:#fff;font-weight:800;font-size:1rem;cursor:pointer;box-shadow:0 10px 25px rgba(6,182,212,.35);text-decoration:none;display:inline-block}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div>
<div class="box">
  <div class="head">
    <div style="font-size:.8rem;font-weight:800;opacity:.9">@omer // %100 GİZLİ & ŞİFRELİ</div>
    <h1>Bana Anonim Mesaj Gönder! 🤫</h1>
  </div>
  <textarea id="msg" rows="4" placeholder="Aklındakini, itirafını veya merak ettiğin soruyu buraya yaz... Kim olduğun asla görünmez!"></textarea>
  <button class="dice" onclick="rnd()">🎲 Rastgele Soru Öner</button>
  <button class="btn" id="sbtn" onclick="sendAnon()">Anonim Gönder 🚀</button>
  <div id="st" style="margin-top:12px;font-size:.9rem;font-weight:700;color:#67e8f9"></div>
  <div style="margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1);font-size:.8rem;color:#94a3b8">
    Sen de kendi anonim soru & web siteni ister misin? <br><a href="/" style="color:#ec4899;font-weight:700;text-decoration:none">Ömer Siber Ana Sayfaya Git &rarr;</a>
  </div>
</div>
<script>
const ideas=["Hakkımda ilk düşündüğün şey neydi?","Bana söyleyemediğin bir sırrın var mı?","Şu an en çok ne yapmak isterdin?","Beni tek kelimeyle nasıl tanımlarsın?","Instagram'da en sevdiğin özelliğim ne?"];
function rnd(){msg.value=ideas[Math.floor(Math.random()*ideas.length)]}
async function sendAnon(){
  const t=msg.value.trim();if(!t)return;
  sbtn.disabled=true;st.textContent="Şifreli kanaldan iletiliyor...";
  const f=await fetch("/api/send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:"Anonim Ziyaretçi 🤫",contact:"Instagram Story",service:"Anonim Soru / İtiraf",message:t})});
  const k=await f.json();
  if(k.ok){st.textContent="✓ Anonim mesajın Ömer'e iletildi!";msg.value="";}
  else{st.textContent="Bir hata oluştu, tekrar dene.";}
  sbtn.disabled=false;
}
</script>
</body>
</html>
