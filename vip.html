<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIP Dijital Profil | Örnek Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#090514;color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;overflow-x:hidden}
.orb{position:fixed;border-radius:50%;filter:blur(90px);z-index:0;opacity:.65}
.o1{width:300px;height:300px;background:#ec4899;top:-50px;left:-50px}.o2{width:340px;height:340px;background:#06b6d4;bottom:-60px;right:-50px}
.card{position:relative;z-index:1;max-width:420px;width:100%;background:rgba(18,12,36,.85);border:1px solid rgba(236,72,153,.5);border-radius:28px;padding:30px 24px;backdrop-filter:blur(20px);box-shadow:0 25px 60px rgba(0,0,0,.75);text-align:center}
.av{width:88px;height:88px;border-radius:50%;margin:0 auto 14px;background:linear-gradient(135deg,#ec4899,#8b5cf6,#06b6d4);padding:3px;box-shadow:0 0 25px rgba(236,72,153,.5)}
.av-in{width:100%;height:100%;background:#0f0921;border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:2rem;font-weight:900;color:#67e8f9}
h1{font-size:1.55rem;font-weight:900;margin-bottom:4px}
.bio{color:#cbd5e1;font-size:.88rem;margin-bottom:20px}
.links{display:grid;gap:11px;margin-bottom:20px}
.lnk{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#fff;text-decoration:none;font-weight:700;font-size:.92rem;transition:.25s}
.lnk:hover{transform:translateY(-3px);border-color:#ec4899;background:rgba(236,72,153,.18)}
.cta{display:block;padding:14px;border-radius:16px;background:linear-gradient(135deg,#ec4899,#8b5cf6);color:#fff;font-weight:800;text-decoration:none;font-size:.95rem;box-shadow:0 10px 25px rgba(236,72,153,.35)}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div>
<div class="card">
  <div class="av"><div class="av-in">VIP</div></div>
  <h1>@seninadin <span style="color:#06b6d4;font-size:1.1rem">✓</span></h1>
  <p class="bio">İstanbul // Dijital İçerik Üreticisi & Tasarımcı ✨</p>
  <div class="links">
    <a href="#" class="lnk"><span>📸 Instagram Profilim</span><span style="color:#ec4899">&rarr;</span></a>
    <a href="#" class="lnk"><span>🎵 TikTok Hesabım</span><span style="color:#67e8f9">&rarr;</span></a>
    <a href="#" class="lnk"><span>🎧 Favori Spotify Listem</span><span style="color:#10b981">&rarr;</span></a>
    <a href="#" class="lnk"><span>🎮 Discord & Oyun Profilim</span><span style="color:#a855f7">&rarr;</span></a>
  </div>
  <a href="/#iletisim" class="cta">⚡ Sen de Kendi VIP Sayfanı Yaptır (400 TL)</a>
</div>
</body>
</html>
