<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ömer | VIP Dijital Profil</title>
<style>
:root{--c1:#ec4899;--c2:#8b5cf6;--c3:#06b6d4}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#090514;color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;overflow-x:hidden}
.orb{position:fixed;border-radius:50%;filter:blur(90px);z-index:0;opacity:.65;transition:.5s}
.o1{width:300px;height:300px;background:var(--c1);top:-50px;left:-50px}.o2{width:340px;height:340px;background:var(--c3);bottom:-60px;right:-50px}
.card{position:relative;z-index:1;max-width:430px;width:100%;background:rgba(18,12,36,.85);border:1px solid var(--c1);border-radius:28px;padding:26px 22px;backdrop-filter:blur(20px);box-shadow:0 25px 60px rgba(0,0,0,.75);text-align:center;transition:.4s}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.dots{display:flex;gap:8px}
.dot{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid rgba(255,255,255,.4)}
.cp-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#cbd5e1;font-size:.75rem;font-weight:700;padding:5px 11px;border-radius:99px;cursor:pointer}
.av{width:84px;height:84px;border-radius:50%;margin:0 auto 12px;background:linear-gradient(135deg,var(--c1),var(--c2),var(--c3));padding:3px}
.av-in{width:100%;height:100%;background:#0f0921;border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:1.75rem;font-weight:900;color:#67e8f9}
h1{font-size:1.5rem;font-weight:900;margin-bottom:4px}
.bio{color:#cbd5e1;font-size:.86rem;margin-bottom:14px}
.vibe{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:10px 14px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;font-size:.8rem;color:#67e8f9}
.links{display:grid;gap:10px;margin-bottom:18px}
.lnk{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-radius:15px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#fff;text-decoration:none;font-weight:700;font-size:.9rem;transition:.25s}
.lnk:hover{transform:translateY(-2px);border-color:var(--c1);background:rgba(255,255,255,.11)}
.cta{display:block;padding:14px;border-radius:16px;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;font-weight:800;text-decoration:none;font-size:.92rem}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div>
<div class="card">
  <div class="top-bar">
    <div class="dots" title="Tema Rengini Değiştir">
      <div class="dot" style="background:#ec4899" onclick="th('#ec4899','#8b5cf6','#06b6d4')"></div>
      <div class="dot" style="background:#06b6d4" onclick="th('#06b6d4','#3b82f6','#10b981')"></div>
      <div class="dot" style="background:#10b981" onclick="th('#10b981','#059669','#eab308')"></div>
    </div>
    <button class="cp-btn" id="cpb" onclick="cp()">🔗 Linki Kopyala</button>
  </div>
  <div class="av"><div class="av-in">ÖMR</div></div>
  <h1>@omerwebs <span style="color:#06b6d4;font-size:1.1rem">✓</span></h1>
  <p class="bio">İstanbul // Siber Güvenlik & Web Tasarım ✨</p>
  <div class="vibe"><span>🎧 Cyber Vibe Mode // Aktif</span><span style="color:#10b981;font-weight:800">● ONLINE</span></div>
  <div class="links">
    <a href="https://t.me"omerwebs target="_blank" class="lnk"><span>✈️ Telegram İletişim (@omerwebs)</span><span>&rarr;</span></a>
    <a href="https://bionluk.com"omer29 target="_blank" class="lnk"><span>💼 Bionluk Resmi Profilim</span><span>&rarr;</span></a>
    <a href="/" class="lnk"><span>🛡️ Siber Güvenlik & Hizmetlerim</span><span>&rarr;</span></a>
    <a href="/test.html" class="lnk"><span>⚡ Siber Duo Uyum Testi (Story)</span><span>&rarr;</span></a>
    <a href="/soru.html" class="lnk"><span>🤫 Bana Anonim Mesaj Gönder</span><span>&rarr;</span></a>
  </div>
  <a href="/#iletisim" class="cta">⚡ Sen de Kendi VIP Sayfanı Yaptır (400 TL)</a>
</div>
<script>
function th(a,b,c){const r=document.documentElement.style;r.setProperty('--c1',a);r.setProperty('--c2',b);r.setProperty('--c3',c)}
function cp(){navigator.clipboard.writeText(location.href);cpb.textContent='✓ Kopyalandı!';setTimeout(()=>cpb.textContent='🔗 Linki Kopyala',2000)}
</script>
</body>
</html>
